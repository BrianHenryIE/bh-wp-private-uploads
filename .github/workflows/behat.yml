name: Behat

# Runs WP-CLI Behat feature tests.
#
# WP_CLI_TEST_DBTYPE=sqlite vendor/bin/behat
#
# Uses SQLite, so no MySQL service is needed.
#
# @author BrianHenryIE

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behat:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ '8.1' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `wp-cli` tool: `composer install` installs the WP-CLI this project pins into `vendor-wp-cli/`
      # (via the `install-wp-cli` post-install script), and `behat.php` points `WP_CLI_BIN_DIR` at it.
      - name: Install PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, wp-cli:nightly
          extensions: zip, sqlite3

      - name: Install PHP dependencies
        run: composer install --verbose

      # When a post is created for a downloaded PDF, WordPress generates a preview image with ImageMagick,
      # which shells out to Ghostscript (`gs`). Without it the command still succeeds but prints
      # `sh: 1: gs: not found` to STDERR, and Behat's `When I run` step fails on any STDERR output.
      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Run Behat tests
        run: composer behat
